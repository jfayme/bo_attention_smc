# The environment every recorded result in records/ was produced in (the
# conda env `aimnet-bo`, 2026-10-02), restricted to what the code imports:
# bo_attention_smc, conformer.py, featuriser.py and the tests. Their own
# dependencies are left to pip.
#
#     conda env create -f environment.yml
#     conda activate bo-attention-smc
#
# torch is the CUDA 13.0 build, which the RTX 5090 (sm_120) needs; on another
# GPU or the CPU, change the index URL to the matching PyTorch build. MAP
# campaigns run on the CPU. SMC campaigns ran on an RTX 5090 laptop GPU, and
# their replays were checked there only: another GPU may differ in the last
# bits, and then, through resampling, in the choices.

name: bo-attention-smc
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.0
      - botorch==0.18.0
      - gpytorch==1.15.2
      - linear_operator==0.6.1
      - numpy==2.4.6
      - pandas==3.0.6
      - scipy==1.17.1
      - scikit-learn==1.9.1
      - rdkit==2026.3.6
      - ase==3.29.0
      - mace-torch==0.3.16
      - transformers==4.57.6
      - sentencepiece==0.2.2
      # AIMNet2, from its repository at the commit the study used
      - aimnet @ git+https://github.com/isayevlab/aimnetcentral@ca29bd58e7646e56c931a488d5f1732abba5bbb1
      # the git hooks of .pre-commit-config.yaml
      - pre-commit==4.6.2
